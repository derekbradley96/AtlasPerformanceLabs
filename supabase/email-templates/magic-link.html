<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont,
    'Segoe UI', sans-serif; background: #0B1220;
    color: #E2E8F0; margin: 0; padding: 0; }
  .container { max-width: 480px; margin: 40px auto;
    padding: 32px 24px; }
  .logo { font-size: 22px; font-weight: 700;
    color: #3B82F6; margin-bottom: 32px; }
  h1 { font-size: 24px; font-weight: 600;
    color: #F1F5F9; margin: 0 0 12px; }
  p { color: #94A3B8; line-height: 1.6;
    margin: 0 0 24px; }
  .btn { display: inline-block; padding: 14px 28px;
    background: #3B82F6; color: #fff !important;
    border-radius: 12px; text-decoration: none;
    font-weight: 600; font-size: 15px; }
  .footer { margin-top: 40px; padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px; color: #475569; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Atlas</div>
  <h1>Your sign-in link</h1>
  <p>Click below to sign in to Atlas. This link
     expires in 10 minutes and can only be used once.</p>
  <a href="{{ .ConfirmationURL }}" class="btn">
    Sign in to Atlas →
  </a>
  <p style="margin-top: 24px; font-size: 13px;">
    If you didn't request this, you can ignore this email.
  </p>
  <div class="footer">
    Atlas Performance Labs ·
    <a href="https://atlasperformancelabs.co.uk/privacy"
       style="color: #3B82F6;">Privacy Policy</a>
  </div>
</div>
</body>
</html>
