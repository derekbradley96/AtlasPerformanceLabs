			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# ITMS-91065: App Store Connect rejects NEW apps whose commonly-used third-party\n# SDKs (GoogleToolboxForMac here) are unsigned. The community MLKit SPM binaries\n# (d-date/google-mlkit-swiftpm) ship with no signature, and Xcode records an\n# SDK's signature when it consumes the xcframework - Build 8 was rejected even\n# though every framework in the archive carried a valid embed-time signature.\n# So: sign the resolved artifacts BEFORE compile/link. -depth (post-order)\n# is load-bearing: inner frameworks must be signed before the xcframework\n# wrapper, or the wrapper signature is computed over content we then mutate\n# and Xcode fails the build with \"signature cannot be verified\".\n[ \"${CODE_SIGNING_ALLOWED}\" = \"NO\" ] && exit 0\nIDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:-}\"\nif [ -z \"$IDENTITY\" ] || [ \"$IDENTITY\" = \"-\" ]; then exit 0; fi\nARTIFACTS=\"${BUILD_DIR%%/Build/*}/SourcePackages/artifacts/google-mlkit-swiftpm\"\n[ -d \"$ARTIFACTS\" ] || exit 0\nfind \"$ARTIFACTS\" -depth \\( -name \"*.xcframework\" -o -name \"*.framework\" \\) -type d | while read -r BUNDLE; do\n  codesign -v \"$BUNDLE\" >/dev/null 2>&1 && continue\n  codesign --force --sign \"$IDENTITY\" \"$BUNDLE\" >/dev/null 2>&1 || true\ndone\nexit 0\n";
		};
